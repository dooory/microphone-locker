name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Verify Cargo version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $cargoToml = Get-Content -Raw Cargo.toml
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not read version from Cargo.toml"
          }
          $cargoVersion = $Matches[1]
          if ($cargoVersion -ne $tagVersion) {
            throw "Cargo.toml version ($cargoVersion) does not match tag version ($tagVersion)"
          }

      - name: Build release binary
        run: cargo build --release

      - name: Build Inno Setup installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -SkipBuild

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicrophoneLocker-Setup
          path: target/installer/MicrophoneLocker-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/installer/MicrophoneLocker-Setup.exe
